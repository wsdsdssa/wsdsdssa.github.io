about_content: | # this will include new lines to allow paragraphs
  6년차, 블록체인 지갑 · 멀티테넌트 커머스 · 호스팅 플랫폼을 거치며 매번 <b>'팀이 안심하고 맡길 수 있는 구조'</b>를 짜왔습니다. 협업하는 동료들이 디테일을 일일이 챙기지 않아도 되도록 제가 맡은 영역의 엣지케이스까지 책임지는 방식입니다. 멀티체인 NFT의 IPFS 게이트웨이를 헬스체크 기반으로 자동 전환시켜 표시 실패율을 없앤 것도, 3개 브랜드 쇼핑몰을 단일 코드베이스로 운영하며 선착순 판매 오버셀을 트랜잭션 구조로 차단한 것도 같은 원칙에서 나온 결과입니다.<br/><br/>

  AI는 3~4년 전부터 실무에 들여와 지금은 Claude · Codex · Cursor를 함께 씁니다. MCP는 Figma · Ouroboros · Notion · Jira를 연결해 디자인 스펙 동기화와 기획 리뷰에 상시 활용 중이고, 사이드 프로젝트(영어 튜터 앱 '온달톡', Flutter+NestJS 1인 개발)에서는 GStack plan-eng-review · Ouroboros interview · Grill Me로 기획부터 구현 방향까지 검증합니다.<br/>
  코드를 받아쓰는 게 아니라, AI가 낸 결과를 리뷰·검증해 아키텍처와 품질을 책임지는 쪽이 제 역할이라고 생각합니다. 앞으로 개발자의 핵심 역량은 기획력 · 프롬프트 설계 · 코드 리뷰로 옮겨간다고 보고, 그 방향으로 계속 체득해가고 있습니다.<br/>

  skilled: <mark>TypeScript, Node.js Vue 2, Vue 3, Nuxt, React, Vuex, Jest, Pinia, HTML5, CSS3, TailwindCSS, Figma, git, github, Sourcetree</mark>

