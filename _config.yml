about_content: | # this will include new lines to allow paragraphs
  3년 반 동안 블록체인 지갑, 멀티테넌트 커머스, 호스팅 플랫폼을 거치며 공통적으로 해온 일이 하나 있습니다. 혼자 맡아도 무너지지 않는 구조를 짜는 것입니다. 팀이 있어도 결국 내가 책임지는 영역이 생기고, 그 영역에서 기획부터 배포까지 끝을 본 경험이 지금의 저를 만들었습니다.<br/>
  퍼블리싱의 정밀함과 구조 설계를 같이 챙기는 개발자가 되고 싶었습니다. NFT 조회 문제를 UX 흐름으로 푼 것도, 3개 브랜드를 단일 코드로 운영한 것도 결국 '어떻게 짜야 나중에 안 무너지나'를 먼저 생각한 결과였습니다.<br/>

  요즘은 AI가 개발 방식 자체를 바꾸고 있다고 느낍니다. 3~4년 전에는 AI가 변수명도, CSS 클래스명도 엉망으로 짜던 수준이었는데, MCP와 커스텀 스킬을 실무와 사이드 프로젝트에 직접 적용해보면서 지금은 완전히 다른 도구가 됐다는 걸 체감하고 있습니다.<br/>
  현재 AI 바이브 코딩 방식으로 음성 대화 영어 튜터 앱 '온달톡'을 Flutter + NestJS로 1인 개발 중입니다. Claude로 플랜을 잡고, Codex로 코드를 뽑고, GStack의 plan-ceo-review로 초기 아이디어를 검증하고 plan-eng-review로 구현 방향을 정리합니다. 세부 기능 단위에서는 Ouroboros ooo interview로 기획을 구체화하고, 최근엔 Grill Me로 놓친 설계 포인트를 미리 짚어내는 방식을 쓰고 있습니다.<br/>
  단순히 코드를 받아쓰는 게 아닙니다. AI가 낸 결과를 직접 리뷰하고 검증하면서, 아키텍처와 품질은 제가 책임지는 방식입니다. 전체 흐름을 놓치는 AI에게 흐름을 잡아주고, 코드 리뷰로 품질을 걸러내는 개발자가 앞으로 훨씬 더 중요해질 거라 생각합니다. 기획력, 프롬프트 설계, 코드 리뷰 — 이 세 가지가 결국 AI 시대 개발자의 핵심 역량이라고 믿고, 그 방향으로 계속 체득해가고 있습니다.<br/>

  skilled: <mark>TypeScript, Node.js Vue 2, Vue 3, Nuxt, React, Vuex, Jest, Pinia, HTML5, CSS3, TailwindCSS, Figma, git, github, Sourcetree</mark>

